plugins {
    id 'com.android.application'
}

android {
    namespace 'com.custom.steamdecklauncher'
    compileSdk 34

    sourceSets {
        main {
            manifest.srcFile 'main/AndroidManifest.xml'
            java.srcDirs = ['main/src/java']
            res.srcDirs = ['main/src/res']
        }
    }

    defaultConfig {
        applicationId "com.custom.steamdecklauncher"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
