name: Build Android TV Launcher APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ensure Valid Android XML Files
        run: |
          NS="http://schemas.android"".""com/apk/res/android"
          mkdir -p app/main/src/res/drawable
          cat << EOF > app/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="$NS">
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <application android:allowBackup="true" android:label="SteamDeck TV" android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask" android:stateNotNeeded="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF
          cat << EOF > app/main/src/res/drawable/ic_steam_deck.xml
          <vector xmlns:android="$NS"
              android:width="64dp" android:height="64dp"
              android:viewportWidth="100" android:viewportHeight="100">
              <path android:fillColor="#1A9FFF" android:pathData="M50,8 A42,42 0 1,1 50,92 L50,76 A26,26 0 1,0 50,24 Z" />
              <path android:fillColor="#FFFFFF" android:pathData="M50,31 A19,19 0 1,1 50,69 A19,19 0 1,1 50,31 Z" />
          </vector>
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SteamDeckTVLauncher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
